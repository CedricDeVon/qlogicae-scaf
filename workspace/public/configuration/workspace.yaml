
data:
  selection:
    is-enabled: true

    default:
      name: root
      targets:
        all:
          full-path: ${{ current-root-full-path }}

        root:
          full-path: ${{ current-root-full-path }}

        project:
          full-path: ${{ current-root-full-path }}

    project:
      targets:

  script:
    is-enabled: true    
    process: shell
    is-process-override-enabled: false

    targets:
      value-cache-debug:
        enter-full-path: ${{ current-root-full-path }}/workspace/public/toolset/qlogicae-logis
        commands:
          - run: "python3 -c \"
              from qlogicae_logis.v1 import workspace_manager;
              workspace_manager.singleton.debug_value_cache();\""
            is-enabled: true

    clean:
      is-enabled: true

      exclude:
        targets:
          - name: ${{ current-root-full-path }}
          - name: ${{ current-root-full-path }}/selection
          - name: ${{ current-root-full-path }}/workspace
          - name: ${{ current-root-full-path }}/.github  
          - name: ${{ current-root-full-path }}/.temporary            

      include:
        targets:
          root-temporary:
            - name: ${{ current-root-full-path }}/workspace/private/temporary

  time:
    zone: local

  log:
    is-enabled: true
    is-override-enabled: false
    is-verbose-enabled: true
    is-verbose-override-enabled: false

    file:
      is-enabled: true
      is-verbose-enabled: true
      targets:
        - name: ${{ current-root-full-path }}/workspace/private/temporary/log/${{ current-date }}.log            

    console:
      is-enabled: true
      is-verbose-enabled: false

  macros:  
    value-cache:
      targets:
        - name: current-date
        - name: current-year
        - name: current-root-full-path

    file:
      targets:
        - name: company-name
          value: Company Name

        - name: project-name
          value: Project Name

        - name: project-description
          value: Project Description
      
        - name: author-name
          value: Author Name
      
        - name: author-email
          value: email@gmail.com

metadata:

